<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0d0d10">
<title>Maps</title>
<link rel="stylesheet" href="css/style.css">
<!-- pwa:begin -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Zombies">
<meta name="application-name" content="Zombies">
<link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png">
<link rel="icon" sizes="192x192" href="icons/icon-192.png">
<link rel="icon" sizes="32x32" href="icons/favicon-32.png">
<!-- pwa:end -->
</head>
<body>
<div class="wrap">

  <nav class="back-bar"><a href="index.html">&#8249; All games</a></nav>

  <header class="game-title" id="gameTitle"></header>

  <main class="map-list" id="mapList"></main>

  <footer class="site-footer">Personal guide app &middot; not affiliated with Activision</footer>
</div>

<script src="js/data.js"></script>
<script>
  const gid = new URLSearchParams(location.search).get("g");
  const game = GAMES.find(g => g.id === gid);

  if (!game) {
    document.getElementById("gameTitle").innerHTML = "<h1>Game not found</h1>";
  } else {
    document.title = game.name + " – Maps";
    document.documentElement.style.setProperty("--accent", game.accent);
    document.documentElement.style.setProperty("--accent2", game.accent2);

    document.getElementById("gameTitle").innerHTML =
      "<h1>" + game.name + "</h1>" +
      '<div class="sub">' + game.year + " &middot; " + game.tagline + "</div>";

    const list = document.getElementById("mapList");
    game.maps.forEach(m => {
      const note = m.note ? '<div class="note">' + m.note + "</div>" : "";
      if (m.built) {
        const a = document.createElement("a");
        a.className = "map-row";
        a.href = "maps/" + m.id + ".html";
        a.innerHTML = '<div class="name">' + m.name + "</div>" + note + '<span class="chev">&#8250;</span>';
        list.appendChild(a);
      } else {
        const d = document.createElement("div");
        d.className = "map-row soon";
        d.innerHTML = '<div class="name">' + m.name + "</div>" + note + '<span class="soon-tag">coming soon</span>';
        list.appendChild(d);
      }
    });
  }
</script>
<script src="js/pwa.js" defer></script>
</body>
</html>
